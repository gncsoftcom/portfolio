<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmet Yılmaz · Portfolyo</title>
  <meta name="description" content="Yazılım geliştirici portfolyosu — projeler, deneyim ve iletişim.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>
  <!-- NAVBAR -->
  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a href="#hero" class="nav__logo" data-field="initials">AY</a>
      <nav class="nav__menu" id="navMenu">
        <a href="#about" class="nav__link" data-i18n="nav.about">Hakkımda</a>
        <a href="#projects" class="nav__link" data-i18n="nav.projects">Projeler</a>
        <a href="#experience" class="nav__link" data-i18n="nav.experience">Deneyim</a>
        <a href="#contact" class="nav__link" data-i18n="nav.contact">İletişim</a>
      </nav>
      <div class="nav__actions">
        <button class="lang-btn" id="langBtn" type="button" data-i18n-aria="lang.switch">
          <span data-lang-opt="tr">TR</span><span class="lang-btn__sep">/</span><span data-lang-opt="en">EN</span>
        </button>
        <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="navMenu" data-i18n-aria="nav.menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero__bg" aria-hidden="true">
        <span class="blob blob--1"></span>
        <span class="blob blob--2"></span>
        <span class="blob blob--3"></span>
        <span class="shape shape--ring"></span>
        <span class="shape shape--square"></span>
        <span class="shape shape--tri"></span>
      </div>
      <div class="container hero__content">
        <p class="hero__greeting" data-i18n="hero.greeting">Merhaba, ben</p>
        <h1 class="hero__name" data-field="name">Ahmet Yılmaz</h1>
        <p class="hero__role"><span id="typed"></span><span class="caret" aria-hidden="true"></span></p>
        <p class="hero__tagline" data-field="tagline"></p>
        <div class="hero__buttons">
          <a href="#projects" class="btn btn--primary" data-i18n="hero.projects">Projelerim</a>
          <a href="assets/cv.pdf" class="btn btn--ghost" id="cvBtn" download>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>
            <span data-i18n="hero.cv">CV İndir</span>
          </a>
        </div>
      </div>
      <a href="#about" class="hero__scroll" data-i18n-aria="hero.scroll"><span></span></a>
    </section>

    <!-- ABOUT + SKILLS -->
    <section class="section" id="about">
      <div class="container">
        <p class="kicker reveal" data-i18n="about.kicker">01 · Hakkımda</p>
        <h2 class="section__title reveal" data-i18n="about.title"></h2>
        <div class="about">
          <div class="about__text reveal">
            <div class="about__avatar" aria-hidden="true"><span data-field="initials">AY</span></div>
            <div id="aboutText"></div>
            <div class="stats" id="stats"></div>
          </div>
          <div class="about__skills reveal">
            <h3 class="sub-title" data-i18n="skills.title">Yetenekler</h3>
            <div id="skills"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="section section--alt" id="projects">
      <div class="container">
        <p class="kicker reveal" data-i18n="projects.kicker">02 · Projeler</p>
        <h2 class="section__title reveal" data-i18n="projects.title"></h2>
        <div class="projects" id="projectList"></div>
      </div>
    </section>

    <!-- EXPERIENCE / EDUCATION -->
    <section class="section" id="experience">
      <div class="container">
        <p class="kicker reveal" data-i18n="exp.kicker">03 · Yolculuk</p>
        <h2 class="section__title reveal" data-i18n="exp.title"></h2>
        <div class="tabs reveal" role="tablist">
          <button class="tab is-active" role="tab" id="tab-work" aria-selected="true" aria-controls="panel-work" data-i18n="exp.work">Deneyim</button>
          <button class="tab" role="tab" id="tab-edu" aria-selected="false" aria-controls="panel-edu" tabindex="-1" data-i18n="exp.edu">Eğitim</button>
        </div>
        <div class="timeline" id="panel-work" role="tabpanel" aria-labelledby="tab-work"></div>
        <div class="timeline" id="panel-edu" role="tabpanel" aria-labelledby="tab-edu" hidden></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section section--alt" id="contact">
      <div class="container contact">
        <div class="contact__info reveal">
          <p class="kicker" data-i18n="contact.kicker">04 · İletişim</p>
          <h2 class="section__title" data-i18n="contact.title"></h2>
          <p class="contact__text" data-i18n="contact.text"></p>
          <ul class="contact__list" id="contactList"></ul>
          <div class="social" id="social"></div>
        </div>
        <form class="form reveal" id="contactForm" novalidate>
          <div class="field">
            <input type="text" id="fName" name="name" required minlength="2" placeholder=" " autocomplete="name">
            <label for="fName" data-i18n="form.name">Adınız</label>
          </div>
          <div class="field">
            <input type="email" id="fEmail" name="email" required placeholder=" " autocomplete="email">
            <label for="fEmail" data-i18n="form.email">E-posta</label>
          </div>
          <div class="field">
            <textarea id="fMessage" name="message" rows="5" required minlength="10" placeholder=" "></textarea>
            <label for="fMessage" data-i18n="form.message">Mesajınız</label>
          </div>
          <button type="submit" class="btn btn--primary btn--block" data-i18n="form.send">Mesaj Gönder</button>
          <p class="form__note">
            <span data-i18n="form.kvkkBefore"></span><button type="button" class="link-btn" data-open-kvkk data-i18n="form.kvkkLink"></button><span data-i18n="form.kvkkAfter"></span>
          </p>
        </form>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <p>&copy; <span id="year"></span> <span data-field="name"></span>. <span data-i18n="footer.rights"></span></p>
      <button type="button" class="link-btn" data-open-kvkk data-i18n="footer.kvkk"></button>
      <a href="#hero" class="to-top" data-i18n-aria="footer.top">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 6l-6 6 1.4 1.4L11 9.8V20h2V9.8l3.6 3.6L18 12z"/></svg>
      </a>
    </div>
  </footer>

  <!-- KVKK MODAL -->
  <div class="modal" id="kvkkModal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="kvkkTitle" tabindex="-1">
      <button type="button" class="modal__close" data-close-modal data-i18n-aria="modal.close">&times;</button>
      <h2 class="modal__title" id="kvkkTitle"></h2>
      <div class="modal__body" id="kvkkBody"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
